<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tulipán y Lirio Amarillo</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 45%, #1f1811 0%, #110d0a 60%, #080605 100%);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-poetic {
      font-family: 'Playfair Display', serif;
    }

    /* Staged SVG Stem draw animation */
    .stem-path {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawStem 2.2s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    @keyframes drawStem {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Leaf unfold animation */
    .leaf-unfurl {
      opacity: 0;
      transform-origin: bottom center;
      transform: scale(0) rotate(-10deg);
      animation: unfurl 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .leaf-right {
      transform: scale(0) rotate(10deg);
    }
    @keyframes unfurl {
      0% { opacity: 0; transform: scale(0); }
      40% { opacity: 1; }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* Blossom opening animation */
    .bloom-flower {
      opacity: 0;
      transform-origin: center bottom;
      transform: scale(0.1) translateY(20px);
      animation: openBloom 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes openBloom {
      0% {
        opacity: 0;
        transform: scale(0.15) translateY(25px);
      }
      50% {
        opacity: 0.9;
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Subtle continuous breathing sway after bloom completes */
    .gentle-sway {
      animation: ambientSway 6s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }
    @keyframes ambientSway {
      0% { transform: rotate(-1.2deg); }
      100% { transform: rotate(1.2deg); }
    }

    /* Warm light halo pulse */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(0.96); }
      50% { opacity: 0.55; transform: scale(1.06); }
    }
    .glow-aura {
      animation: pulseGlow 5.5s ease-in-out infinite;
    }

    /* Floating pollen dust */
    .pollen-particle {
      position: absolute;
      border-radius: 9999px;
      background: radial-gradient(circle, #fffbeb 20%, #fde047 70%, rgba(250, 204, 21, 0) 100%);
      pointer-events: none;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.4);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-240px) scale(1.1);
        opacity: 0;
      }
    }
  </style>
</head>

<body class="h-screen w-screen flex flex-col items-center justify-between text-amber-50 p-6 relative">

  <!-- Ambient warm golden halo behind the flowers -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 sm:w-96 h-72 sm:h-96 bg-amber-400/20 rounded-full blur-[100px] pointer-events-none glow-aura"></div>

  <!-- Subtle pollen container -->
  <div id="pollenContainer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

  <!-- Minimalist Title -->
  <header class="text-center z-10 pt-4 opacity-0 transition-opacity duration-1000" id="headerText">
    <p class="text-[11px] uppercase tracking-[0.3em] text-amber-300/60 font-medium mb-1">
      Un detalle eterno
    </p>
    <h1 class="font-poetic text-2xl sm:text-3xl text-amber-100/95 italic font-normal">
      Tulipán &amp; Lirio Amarillo
    </h1>
  </header>

  <div class="relative z-10 w-full max-w-md flex-1 flex items-center justify-center -my-4">
    <svg id="flowerSvg" class="w-full h-[62vh] max-h-[520px] gentle-sway overflow-visible" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Stems & Leaves Linear Gradients -->
        <linearGradient id="stemGrad" x1="0" y1="500" x2="0" y2="150" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2d3d0f" />
          <stop offset="50%" stop-color="#4d7c0f" />
          <stop offset="100%" stop-color="#65a30d" />
        </linearGradient>

        <linearGradient id="tulipLeafGrad" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#365314" />
          <stop offset="60%" stop-color="#4d7c0f" />
          <stop offset="100%" stop-color="#84cc16" />
        </linearGradient>

        <linearGradient id="lilyLeafGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#65a30d" />
          <stop offset="50%" stop-color="#3f6212" />
          <stop offset="100%" stop-color="#283e0b" />
        </linearGradient>

        <!-- Tulip Petal Gradients -->
        <linearGradient id="tulipPetalOuter" x1="0.5" y1="1" x2="0.5" y2="0">
          <stop offset="0%" stop-color="#d97706" />
          <stop offset="35%" stop-color="#f59e0b" />
          <stop offset="85%" stop-color="#fde047" />
          <stop offset="100%" stop-color="#fef08a" />
        </linearGradient>

        <linearGradient id="tulipPetalCenter" x1="0.5" y1="1" x2="0.5" y2="0">
          <stop offset="0%" stop-color="#b45309" />
          <stop offset="25%" stop-color="#d97706" />
          <stop offset="70%" stop-color="#fbbf24" />
          <stop offset="100%" stop-color="#ffffff" />
        </linearGradient>

        <!-- Lily Tepal Gradients -->
        <linearGradient id="lilyTepalGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#b45309" />
          <stop offset="20%" stop-color="#d97706" />
          <stop offset="65%" stop-color="#fde047" />
          <stop offset="100%" stop-color="#fffbeb" />
        </linearGradient>

        <!-- Glow filter for petals -->
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- Soft Soil Baseline -->
      <ellipse cx="200" cy="485" rx="80" ry="8" fill="#1c140d" opacity="0.8" />

      <!-- ==================== 1. TULIPÁN (IZQUIERDA) ==================== -->
      <g id="tulipGroup">
        <!-- Stem -->
        <path class="stem-path" d="M 175 480 Q 155 350 160 215" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round" fill="none" style="animation-delay: 0.1s;" />

        <!-- Broad Tulip Leaves -->
        <!-- Leaf 1 (Left broad clasping) -->
        <path class="leaf-unfurl" style="animation-delay: 1.1s;" d="M 172 450 C 130 420 110 330 118 270 C 132 320 155 370 168 410 Z" fill="url(#tulipLeafGrad)" />
        <!-- Leaf 2 (Right upward clasping) -->
        <path class="leaf-unfurl leaf-right" style="animation-delay: 1.4s;" d="M 166 400 C 185 360 195 295 190 250 C 182 290 172 340 163 370 Z" fill="url(#tulipLeafGrad)" opacity="0.9" />

        <!-- Tulip Blossom (Cup) -->
        <g class="bloom-flower" style="animation-delay: 2.3s;">
          <!-- Soft aura -->
          <circle cx="160" cy="180" r="45" fill="#facc15" opacity="0.18" filter="url(#softGlow)" />

          <!-- Back Petals -->
          <path d="M 160 215 C 135 185 140 135 160 120 C 180 135 185 185 160 215 Z" fill="#b45309" opacity="0.8" />

          <!-- Left Petal -->
          <path d="M 160 215 C 125 190 125 145 145 130 C 158 155 160 195 160 215 Z" fill="url(#tulipPetalOuter)" />

          <!-- Right Petal -->
          <path d="M 160 215 C 195 190 195 145 175 130 C 162 155 160 195 160 215 Z" fill="url(#tulipPetalOuter)" />

          <!-- Front Center Petal -->
          <path d="M 160 215 C 138 185 142 140 160 135 C 178 140 182 185 160 215 Z" fill="url(#tulipPetalCenter)" />

          <!-- Delicate petal center vein -->
          <path d="M 160 212 L 160 148" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
        </g>
      </g>

      <!-- ==================== 2. LIRIO (DERECHA) ==================== -->
      <g id="lilyGroup">
        <!-- Stem -->
        <path class="stem-path" d="M 225 480 Q 245 340 240 200" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" style="animation-delay: 0.3s;" />

        <!-- Slender Lily Leaves -->
        <path class="leaf-unfurl" style="animation-delay: 1.2s;" d="M 230 430 C 275 425 295 390 305 355 C 280 375 255 400 232 418 Z" fill="url(#lilyLeafGrad)" />
        <path class="leaf-unfurl leaf-right" style="animation-delay: 1.5s;" d="M 235 365 C 205 345 195 305 190 270 C 208 298 225 330 237 350 Z" fill="url(#lilyLeafGrad)" />
        <path class="leaf-unfurl" style="animation-delay: 1.7s;" d="M 240 300 C 270 280 282 245 285 220 C 270 245 255 270 241 288 Z" fill="url(#lilyLeafGrad)" />

        <!-- Lily Blossom (Star-shaped recurved tepals) -->
        <g class="bloom-flower" style="animation-delay: 2.7s;">
          <!-- Soft aura -->
          <circle cx="240" cy="180" r="50" fill="#facc15" opacity="0.2" filter="url(#softGlow)" />

          <!-- Tepal 1 (Top) -->
          <path d="M 240 195 C 230 160 220 120 240 100 C 260 120 250 160 240 195 Z" fill="url(#lilyTepalGrad)" />
          <!-- Tepal 2 (Top Left) -->
          <path d="M 240 195 C 205 180 165 150 160 130 C 185 140 215 170 240 195 Z" fill="url(#lilyTepalGrad)" />
          <!-- Tepal 3 (Top Right) -->
          <path d="M 240 195 C 275 180 315 150 320 130 C 295 140 265 170 240 195 Z" fill="url(#lilyTepalGrad)" />
          <!-- Tepal 4 (Bottom Left) -->
          <path d="M 240 195 C 205 200 165 225 150 245 C 175 235 215 215 240 195 Z" fill="url(#lilyTepalGrad)" />
          <!-- Tepal 5 (Bottom Right) -->
          <path d="M 240 195 C 275 200 315 225 330 245 C 305 235 265 215 240 195 Z" fill="url(#lilyTepalGrad)" />
          <!-- Tepal 6 (Bottom Center) -->
          <path d="M 240 195 C 230 225 225 255 240 270 C 255 255 250 225 240 195 Z" fill="url(#lilyTepalGrad)" />

          <!-- Delicate amber freckles near center -->
          <circle cx="236" cy="182" r="1.3" fill="#92400e" opacity="0.8" />
          <circle cx="244" cy="184" r="1.3" fill="#92400e" opacity="0.8" />
          <circle cx="233" cy="190" r="1.2" fill="#92400e" opacity="0.8" />
          <circle cx="247" cy="190" r="1.2" fill="#92400e" opacity="0.8" />
          <circle cx="240" cy="176" r="1.4" fill="#92400e" opacity="0.8" />

          <!-- Warm green/gold Throat -->
          <circle cx="240" cy="195" r="9" fill="#4d7c0f" opacity="0.65" />
          <circle cx="240" cy="195" r="5" fill="#ca8a04" />

          <!-- Lily Stamens with pollen anthers -->
          <!-- Filament 1 -->
          <path d="M 240 195 Q 220 175 215 155" stroke="#bef264" stroke-width="1.3" fill="none" />
          <ellipse cx="215" cy="155" rx="3.5" ry="1.5" transform="rotate(-30 215 155)" fill="#78350f" />
          <circle cx="215" cy="155" r="1" fill="#fde047" />

          <!-- Filament 2 -->
          <path d="M 240 195 Q 235 160 235 140" stroke="#bef264" stroke-width="1.3" fill="none" />
          <ellipse cx="235" cy="140" rx="3.5" ry="1.5" transform="rotate(10 235 140)" fill="#78350f" />
          <circle cx="235" cy="140" r="1" fill="#fde047" />

          <!-- Filament 3 -->
          <path d="M 240 195 Q 255 170 265 155" stroke="#bef264" stroke-width="1.3" fill="none" />
          <ellipse cx="265" cy="155" rx="3.5" ry="1.5" transform="rotate(35 265 155)" fill="#78350f" />
          <circle cx="265" cy="155" r="1" fill="#fde047" />

          <!-- Central Pistil -->
          <path d="M 240 195 L 240 145" stroke="#a3e635" stroke-width="1.6" fill="none" />
          <circle cx="240" cy="145" r="2.2" fill="#3f6212" />
        </g>
      </g>
    </svg>
  </div>

  <footer class="text-center z-10 pb-5 max-w-sm flex flex-col items-center">
    <!-- Poetic line revealing after bloom -->
    <p id="dedicationText" class="font-poetic italic text-sm sm:text-base text-amber-100/80 mb-4 opacity-0 transition-all duration-1000 transform translate-y-2">
      «Para ti: un pequeño detalle que creo que te mereces y compra mas estanterias»
    </p>

    <!-- Clean, simple restart button -->
    <button id="restartBtn" class="flex items-center gap-2 px-4 py-2 rounded-full bg-amber-400/10 hover:bg-amber-400/20 border border-amber-300/30 text-amber-200 text-xs tracking-wider uppercase transition-all duration-300 active:scale-95 cursor-pointer">
      <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 text-amber-400"></i>
      <span>Florecer de nuevo</span>
    </button>
  </footer>

  <script>
    // Create subtle floating golden pollen specks
    const pollenContainer = document.getElementById('pollenContainer');
    function createPollen() {
      for (let i = 0; i < 14; i++) {
        const p = document.createElement('div');
        p.className = 'pollen-particle';
        const size = Math.random() * 3.5 + 2;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (Math.random() * 80 + 10) + '%';
        p.style.top = (Math.random() * 50 + 40) + '%';
        p.style.animationDuration = (Math.random() * 4 + 4) + 's';
        p.style.animationDelay = (Math.random() * 3) + 's';
        pollenContainer.appendChild(p);
      }
    }

    // Smooth reveal of header and poetic line after bloom is finished
    function scheduleTextReveals() {
      setTimeout(() => {
        document.getElementById('headerText').classList.remove('opacity-0');
      }, 600);

      setTimeout(() => {
        const d = document.getElementById('dedicationText');
        d.classList.remove('opacity-0', 'translate-y-2');
        d.classList.add('opacity-100', 'translate-y-0');
      }, 4200);
    }

    // Clean reset to re-trigger SVG animations effortlessly
    function restartAnimation() {
      const svg = document.getElementById('flowerSvg');
      const dedication = document.getElementById('dedicationText');

      // Hide dedication
      dedication.classList.remove('opacity-100', 'translate-y-0');
      dedication.classList.add('opacity-0', 'translate-y-2');

      // Re-clone SVG node to reset all SVG CSS animations cleanly
      const clone = svg.cloneNode(true);
      svg.parentNode.replaceChild(clone, svg);

      scheduleTextReveals();
    }

    document.getElementById('restartBtn').addEventListener('click', restartAnimation);

    window.addEventListener('load', () => {
      lucide.createIcons();
      createPollen();
      scheduleTextReveals();
    });
  </script>
</body>
</html>
